<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espejo Mágico</title>
    <link rel="stylesheet" href="css/vid.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Crimson+Text:ital@1&display=swap" rel="stylesheet">
</head>
<body background="img/fondo.jpg">
    <div class="stars-overlay"></div>
    
    <div class="main-container">
        <h1 class="mirror-title fade-in-magic">Espejo Mágico</h1>

        <div class="mirror-frame">
            <div class="mirror-glass">
                <video autoplay loop controls playsinline class="magic-video">
                    <source src="vid/cartaam.mp4" type="video/mp4">
                    Tu navegador no soporta videos.
                </video>
                <div class="reflection-overlay"></div>
            </div>
        </div> 

        <div class="magic-text">para tu mirada</div>
    </div>
</body>
</html>
